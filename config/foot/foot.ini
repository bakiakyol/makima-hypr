# ~/.config/foot/foot.ini: Makima palette, semi-transparent
# Source: ~/.config/makima-hypr/config/foot/foot.ini
# Colors: ~/.config/makima-hypr/design/palette.md
# All options, with explanations: /etc/xdg/foot/foot.ini and "man foot.ini"

[main]
# 11: picked on the 43" TV (scale 1.6) from 9-12; 10 was a bit small from a distance
font=JetBrainsMono Nerd Font:size=11
# Inner padding so text doesn't touch the edge (horizontal x vertical, pixels)
pad=10x8
# Hyprland sees this as the window class (match = { class = "^foot$" } in window rules)
app-id=foot

[scrollback]
lines=5000

[cursor]
style=block
blink=no

[mouse]
# Hide the mouse pointer while typing
hide-when-typing=yes

[colors-dark]
# 0.93: the background stays the palette's dark brown, the wallpaper only shows faintly.
# (0.85 was tried: the red wallpaper bled through and tinted the background red.)
alpha=0.93
background=140b07
foreground=e8dccb

# Normal colors (0-7): black red green yellow blue magenta cyan white
# green, blue, magenta and cyan are the "uyumlu" set (sage, lavender, rose, teal),
# built in OKLCH to match amber and crimson; see config/zsh/makima.zsh
regular0=22140e
regular1=e22e0e
regular2=9fc17d
regular3=f2a33a
regular4=b7b6f6
regular5=f196a4
regular6=58b4c4
regular7=c9b8a6

# Bright colors (8-15)
# Bright black: Claude Code (dark-ansi) uses it both for dim text and as the background
# of panels and your own messages. #614e45 balances the two: cream text on it 5.8:1,
# as dim text on the background 2.5:1 (was #6b5348: 5.3 and 2.7)
bright0=614e45
bright1=ff5a3c
bright2=bada9c
bright3=ffc266
bright4=d1d1ff
bright5=ffb3bf
bright6=7cccdb
bright7=e8dccb

# Cursor: a crimson block (the main accent); the letter under it stays readable in dark. Selection: dark brown
cursor=140b07 e22e0e
selection-foreground=e8dccb
selection-background=3a231a

# Search results and URL hints
search-box-no-match=140b07 e22e0e
search-box-match=140b07 f2a33a
jump-labels=140b07 f2a33a
urls=f2a33a

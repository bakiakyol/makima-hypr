# ~/.config/hypr/hyprlock.conf: lock screen, Makima palette (hyprlock)
# Source: ~/.config/makima-hypr/config/hypr/hyprlock.conf
# hyprlock still uses the old hyprlang format, not Lua like hyprland.lua.
# Esc, Ctrl+U or Ctrl+Backspace clear the typed password.

$font    = JetBrainsMono Nerd Font
$night   = rgb(140b07)
$muted   = rgb(9f7f70)
$text    = rgb(e8dccb)
$crimson = rgb(e22e0e)
$oxblood = rgb(7f1d06)
$amber   = rgb(f2a33a)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# The blurred, darkened wallpaper. The blur is baked into the image, so the GPU
# does no blurring while locked. Plain night color if the file is missing.
background {
    monitor =
    path = ~/.config/makima-hypr/wallpapers/makima-torii-lock.jpg
    color = $night
}

# Clock, big and amber, above the middle
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $amber
    position = 0, 160
    halign = center
    valign = center
}

# Date under it, e.g. "Wednesday 11 November"
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 18
    font_family = $font
    color = $muted
    position = 0, 70
    halign = center
    valign = center
}

# Password box: oxblood outline, amber while checking, crimson when wrong
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    rounding = 8
    inner_color = rgba(140b07cc)
    outer_color = $oxblood
    check_color = $amber
    fail_color = $crimson
    capslock_color = rgb(c56b46)
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##9f7f70">password</span>
    fail_text = <span foreground="##e22e0e">$FAIL ($ATTEMPTS)</span>
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

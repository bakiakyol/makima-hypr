# ~/.config/hypr/hypridle.conf: what happens when the laptop sits idle (hypridle)
# Source: ~/.config/makima-hypr/config/hypr/hypridle.conf
# hypridle still uses the old hyprlang format, not Lua like hyprland.lua.
#
#   10 min: lock    11 min: screens off, back on with any input    before suspend: lock

general {
    # "loginctl lock-session" (below) ends up here. pidof: never two lock screens at once.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # After waking up, turn the screens on without waiting for a key press
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# ~/.config/hypr/hyprpaper.conf: wallpaper (hyprpaper)
# Source: ~/.config/makima-hypr/config/hypr/hyprpaper.conf
# hyprpaper still uses the old hyprlang format, not Lua like hyprland.lua.

# An empty "monitor" means every screen.
# cover: fill the screen and crop the overflow (like swaybg's "fill").
wallpaper {
    monitor =
    path = ~/.config/makima-hypr/wallpapers/makima-torii.jpg
    fit_mode = cover
}

# No splash text over the wallpaper
splash = false
